# One site. Plain HTTP on port 80 — on AWS the load balancer handles HTTPS
# and forwards plain HTTP to this port.
server {
    listen 80;

    # Where the site's files live *inside the container* (compose.yaml mounts apps/web here).
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
