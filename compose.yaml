services:
  nginx:
    # Official image, pinned to a version so every machine runs the same nginx.
    image: nginx:1.29-alpine
    ports:
      # Mac-side port: WEB_PORT if set (shell or .env), otherwise 8088.
      - "${WEB_PORT:-8088}:80"
    volumes:
      # Our config replaces the image's default site config (:ro = read-only inside the container).
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web:/usr/share/nginx/html:ro
